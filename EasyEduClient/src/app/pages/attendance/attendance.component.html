<div class="container-fluid p-0 animate-fade-in">
  <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-3">
    <div>
      <h3 class="fw-bold mb-1">Student Attendance</h3>
      <p class="text-muted small mb-0">Record and track daily classroom student attendance</p>
    </div>
    <div class="d-flex gap-2">
      <button class="btn btn-outline-success btn-sm" (click)="markAll('Present')">
        <i class="fas fa-check-double"></i> Mark All Present
      </button>
      <button class="btn btn-outline-danger btn-sm" (click)="markAll('Absent')">
        <i class="fas fa-times"></i> Mark All Absent
      </button>
      <button class="btn btn-primary" (click)="saveAttendance()">
        <i class="fas fa-save"></i> Save Attendance
      </button>
    </div>
  </div>

  <div *ngIf="isSaved" class="alert alert-success">
    <i class="fas fa-check-circle me-2"></i> Attendance saved successfully!
  </div>

  <div class="premium-card mb-4">
    <div class="row g-3 align-items-end mb-4">
      <div class="col-12 col-md-4">
        <label class="form-label small fw-bold text-muted">SELECT CLASS</label>
        <select class="form-select form-control-premium" [(ngModel)]="selectedClass">
          <option value="Grade 10">Grade 10</option>
          <option value="Grade 9">Grade 9</option>
          <option value="Grade 12">Grade 12</option>
          <option value="Grade 8">Grade 8</option>
        </select>
      </div>

      <div class="col-12 col-md-4">
        <label class="form-label small fw-bold text-muted">ATTENDANCE DATE</label>
        <input type="date" class="form-control form-control-premium" [(ngModel)]="selectedDate">
      </div>
    </div>

    <!-- Attendance Table -->
    <div class="table-responsive">
      <table class="table-premium">
        <thead>
          <tr>
            <th>Roll No</th>
            <th>Student Name</th>
            <th>Attendance Status</th>
            <th>Note / Remarks</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let r of attendanceRecords">
            <td><strong>{{ r.rollNo }}</strong></td>
            <td>
              <div class="fw-bold">{{ r.studentName }}</div>
            </td>
            <td>
              <div class="btn-group btn-group-sm" role="group">
                <button 
                  type="button" 
                  class="btn" 
                  [class.btn-success]="r.status === 'Present'"
                  [class.btn-outline-success]="r.status !== 'Present'"
                  (click)="setStatus(r, 'Present')"
                >
                  <i class="fas fa-check"></i> Present
                </button>
                <button 
                  type="button" 
                  class="btn" 
                  [class.btn-danger]="r.status === 'Absent'"
                  [class.btn-outline-danger]="r.status !== 'Absent'"
                  (click)="setStatus(r, 'Absent')"
                >
                  <i class="fas fa-times"></i> Absent
                </button>
                <button 
                  type="button" 
                  class="btn" 
                  [class.btn-warning]="r.status === 'Late'"
                  [class.btn-outline-warning]="r.status !== 'Late'"
                  (click)="setStatus(r, 'Late')"
                >
                  <i class="fas fa-clock"></i> Late
                </button>
                <button 
                  type="button" 
                  class="btn" 
                  [class.btn-info]="r.status === 'HalfDay'"
                  [class.btn-outline-info]="r.status !== 'HalfDay'"
                  (click)="setStatus(r, 'HalfDay')"
                >
                  Half Day
                </button>
              </div>
            </td>
            <td>
              <input type="text" class="form-control form-control-premium py-1" placeholder="Optional remark..." [(ngModel)]="r.note">
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
