<div class="container-fluid p-0 animate-fade-in">
  <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-3">
    <div>
      <h3 class="fw-bold mb-1">Examinations & Marksheets</h3>
      <p class="text-muted small mb-0">Schedule exam terms, publish time tables, and record marks</p>
    </div>
    <div>
      <button class="btn btn-primary">
        <i class="fas fa-plus"></i> Create Exam Schedule
      </button>
    </div>
  </div>

  <div class="premium-card">
    <div class="table-responsive">
      <table class="table-premium">
        <thead>
          <tr>
            <th>#</th>
            <th>Exam Title</th>
            <th>Academic Session</th>
            <th>Start Date</th>
            <th>End Date</th>
            <th>Status</th>
            <th class="text-end">Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let ex of exams">
            <td><strong>EX-{{ ex.id }}</strong></td>
            <td><strong class="text-primary">{{ ex.title }}</strong></td>
            <td>{{ ex.session }}</td>
            <td>{{ ex.startDate }}</td>
            <td>{{ ex.endDate }}</td>
            <td>
              <span class="badge-status" [ngClass]="{
                'badge-active': ex.status === 'Completed',
                'badge-pending': ex.status === 'Upcoming',
                'badge-info': ex.status === 'Draft'
              }">{{ ex.status }}</span>
            </td>
            <td class="text-end">
              <button class="btn btn-sm btn-outline-primary me-1"><i class="fas fa-file-signature"></i> Marks Entry</button>
              <button class="btn btn-sm btn-outline-secondary"><i class="fas fa-print"></i> Report Cards</button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
