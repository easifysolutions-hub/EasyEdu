<div class="container-fluid p-0 animate-fade-in">
  <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-3">
    <div>
      <h3 class="fw-bold mb-1">System & General Settings</h3>
      <p class="text-muted small mb-0">Configure school profile, local currency, appearance and localization</p>
    </div>
    <div>
      <button class="btn btn-primary" (click)="saveSettings()">
        <i class="fas fa-save"></i> Save Changes
      </button>
    </div>
  </div>

  <div *ngIf="isSaved" class="alert alert-success">
    <i class="fas fa-check-circle me-2"></i> Settings saved successfully!
  </div>

  <div class="row g-4">
    <div class="col-12 col-lg-8">
      <div class="premium-card mb-4">
        <h5 class="fw-bold text-primary mb-3 border-bottom pb-2">
          <i class="fas fa-building me-2"></i> Institute Profile
        </h5>

        <div class="row g-3">
          <div class="col-12 col-md-6">
            <label class="form-label small fw-bold text-muted">SCHOOL / COLLEGE NAME</label>
            <input type="text" class="form-control form-control-premium" [(ngModel)]="schoolName">
          </div>

          <div class="col-12 col-md-6">
            <label class="form-label small fw-bold text-muted">OFFICIAL EMAIL</label>
            <input type="email" class="form-control form-control-premium" [(ngModel)]="schoolEmail">
          </div>

          <div class="col-12 col-md-6">
            <label class="form-label small fw-bold text-muted">CONTACT PHONE</label>
            <input type="tel" class="form-control form-control-premium" [(ngModel)]="schoolPhone">
          </div>

          <div class="col-12 col-md-6">
            <label class="form-label small fw-bold text-muted">CURRENCY SYMBOL</label>
            <input type="text" class="form-control form-control-premium" [(ngModel)]="currency">
          </div>
        </div>
      </div>

      <div class="premium-card">
        <h5 class="fw-bold text-primary mb-3 border-bottom pb-2">
          <i class="fas fa-language me-2"></i> Multilingual & Regional Preferences
        </h5>

        <div class="row g-3">
          <div class="col-12 col-md-6">
            <label class="form-label small fw-bold text-muted">SYSTEM LANGUAGE</label>
            <select class="form-select form-control-premium" [(ngModel)]="language">
              <option value="en">English</option>
              <option value="hi">हिंदी (Hindi)</option>
              <option value="kn">ಕನ್ನಡ (Kannada)</option>
              <option value="ta">தமிழ் (Tamil)</option>
              <option value="te">తెలుగు (Telugu)</option>
            </select>
          </div>
        </div>
      </div>
    </div>

    <!-- Appearance Card -->
    <div class="col-12 col-lg-4">
      <div class="premium-card">
        <h5 class="fw-bold mb-3">Theme & Appearance</h5>

        <div class="d-flex justify-content-between align-items-center p-3 rounded-12 bg-light border mb-3">
          <div>
            <div class="fw-bold">Dark Mode</div>
            <small class="text-muted">Toggle sleek dark mode theme</small>
          </div>
          <button class="btn btn-sm btn-outline-primary" (click)="themeService.toggleTheme()">
            <i [class]="themeService.isDarkMode() ? 'fas fa-sun' : 'fas fa-moon'"></i>
            {{ themeService.isDarkMode() ? 'Light Mode' : 'Dark Mode' }}
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
