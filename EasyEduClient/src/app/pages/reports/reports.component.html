<div class="container-fluid p-0 animate-fade-in">
  <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-3">
    <div>
      <h3 class="fw-bold mb-1">Intelligence & Reporting Nexus</h3>
      <p class="text-muted small mb-0">Export comprehensive academic, administrative, and financial reports</p>
    </div>
  </div>

  <div class="row g-4">
    <div class="col-12 col-md-6 col-xl-4" *ngFor="let rep of reportCards">
      <div class="premium-card h-100 d-flex flex-column justify-content-between">
        <div>
          <div class="d-flex align-items-center gap-3 mb-3">
            <div class="stat-icon-wrapper" [style.background]="rep.color + '20'" [style.color]="rep.color">
              <i [class]="rep.icon"></i>
            </div>
            <div>
              <span class="badge bg-light text-dark border small mb-1">{{ rep.category }}</span>
              <h5 class="fw-bold mb-0">{{ rep.title }}</h5>
            </div>
          </div>
          <p class="text-muted small">Generate formatted PDF export, Excel spreadsheet, or live analytical view.</p>
        </div>
        <div class="d-flex gap-2 pt-3 border-top">
          <button class="btn btn-sm btn-outline-primary flex-1"><i class="fas fa-file-pdf"></i> PDF</button>
          <button class="btn btn-sm btn-outline-success flex-1"><i class="fas fa-file-excel"></i> Excel</button>
          <button class="btn btn-sm btn-primary flex-1"><i class="fas fa-eye"></i> View</button>
        </div>
      </div>
    </div>
  </div>
</div>
