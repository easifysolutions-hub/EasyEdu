<div class="login-wrapper">
  <!-- Educational Animated Background -->
  <div class="fixed-global-bg">
    <div class="bg-overlay"></div>
  </div>

  <div class="login-card-container animate-fade-in">
    <div class="login-card">
      <div class="text-center mb-4">
        <div class="logo-circle mb-3">
          <i class="fas fa-graduation-cap text-warning"></i>
        </div>
        <h3 class="fw-bold mb-1">EasyEdu<span class="text-primary">.</span></h3>
        <p class="text-muted small">School & College Management System</p>
      </div>

      <div *ngIf="errorMessage" class="alert alert-danger py-2 small">
        {{ errorMessage }}
      </div>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <div class="mb-3">
          <label class="form-label small fw-bold text-muted">EMAIL ADDRESS</label>
          <div class="input-group">
            <span class="input-group-text bg-white border-end-0"><i class="far fa-envelope text-muted"></i></span>
            <input 
              type="email" 
              class="form-control form-control-premium border-start-0 ps-0" 
              formControlName="email"
              placeholder="Enter your email"
            >
          </div>
        </div>

        <div class="mb-3">
          <div class="d-flex justify-content-between align-items-center mb-1">
            <label class="form-label small fw-bold text-muted mb-0">PASSWORD</label>
            <a href="javascript:void(0)" class="text-decoration-none small text-primary">Forgot?</a>
          </div>
          <div class="input-group">
            <span class="input-group-text bg-white border-end-0"><i class="fas fa-lock text-muted"></i></span>
            <input 
              type="password" 
              class="form-control form-control-premium border-start-0 ps-0" 
              formControlName="password"
              placeholder="Enter password"
            >
          </div>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-4">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="rememberMe" checked>
            <label class="form-check-label small text-muted" for="rememberMe">Remember me</label>
          </div>
        </div>

        <button 
          type="submit" 
          class="btn btn-primary w-100 justify-content-center py-2"
          [disabled]="isLoading || loginForm.invalid"
        >
          <span *ngIf="isLoading" class="spinner-border spinner-border-sm me-2"></span>
          <span>Sign In to Dashboard</span>
          <i class="fas fa-arrow-right ms-2" *ngIf="!isLoading"></i>
        </button>
      </form>

      <div class="mt-4 pt-3 border-top text-center">
        <small class="text-muted">Default Credentials: <strong>admin&#64;easyedu.com</strong> / <strong>Admin&#64;123</strong></small>
      </div>
    </div>
  </div>
</div>
